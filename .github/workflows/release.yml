name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        run: ./gradlew build --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | cut -d+ -f1)
          minecraft=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$tag" build/libs/skysong-*.jar --title "Skysong $version for Minecraft $minecraft" --notes-from-tag
          else
            gh release create "$tag" build/libs/skysong-*.jar --title "Skysong $version for Minecraft $minecraft" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
